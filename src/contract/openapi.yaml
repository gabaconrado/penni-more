openapi: 3.1.0
info:
  title: Penni More health API
  version: 0.1.0
  description: Minimal health contract for the Penni More application infrastructure.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: Health
    description: Public process-health operations.
  - name: Internal
    description: Operations available only inside the production service network.
paths:
  /health/live:
    get:
      operationId: getHealthLiveness
      summary: Check process liveness
      description: Returns a generic status without checking application dependencies.
      tags:
        - Health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
  /health/ready:
    get:
      operationId: getHealthReadiness
      summary: Check service readiness
      description: >-
        Checks whether the application and its required dependencies are ready. This operation is
        internal-only and must not be exposed by the production HTTP ingress.
      tags:
        - Internal
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  responses:
    Healthy:
      description: The service is healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
          example:
            status: ok
    Unavailable:
      description: The service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableResponse"
          example:
            status: unavailable
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    UnavailableResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - unavailable
