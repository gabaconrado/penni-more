services:
  database:
    ports:
      - "127.0.0.1:${PENNI_MORE_POSTGRES_PORT:-5432}:5432"

  server:
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: application
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: penni_more.settings.local
    ports:
      - "127.0.0.1:${PENNI_MORE_PORT:-8000}:8000"
    volumes:
      - ../src/backend:/app/src/backend
      - ../src/web:/app/src/web

  api-docs:
    image: docker.io/swaggerapi/swagger-ui:v5.29.0
    environment:
      SWAGGER_JSON: /contract/openapi.yaml
    ports:
      - "127.0.0.1:${PENNI_MORE_DOCS_PORT:-8080}:8080"
    volumes:
      - ../src/contract/openapi.yaml:/contract/openapi.yaml:ro
    networks: [application]
